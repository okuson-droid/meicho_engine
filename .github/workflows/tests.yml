name: Tests

# DEVFLOW_PLAN_20260925.md §5.1
# push のたびに engine/ の検査を回し、通過・失敗・skip を名前つきで Summary に出す。
# cards/ と results/ は GitHub に無いので、それらに触る検査は落ちる。その一覧は engine/ci/missing_assets_allowlist.txt に
# 名指しで持ち（2026-09-25 の #2 の 46 件・理由は全部 FileNotFound か画像索引が空）、一覧で説明できない失敗だけで赤にする。

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Claude outputs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and install the Rust extension (meicho_rs)
        run: python -m pip install pytest numpy ./engine/rust

      # encoding_info() は load_cards() の前に呼ぶと RuntimeError（CLAUDE.md）。ここでは札だけ見る。
      - name: Show what was built
        run: python -c "import meicho_rs; print(sorted(meicho_rs.features()))"

      - name: Run the default test set (slow tests skipped, D-125)
        working-directory: engine
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          python -m pytest tests -q -rfs --junitxml=../pytest.xml 2>&1 | tee ../pytest_output.txt
        continue-on-error: true

      - name: Write the summary (passed / failed / skipped, with names; failures split by the missing-assets allowlist)
        if: always()
        run: |
          python - <<'EOF'
          import os, xml.etree.ElementTree as ET
          allow = set()
          with open("engine/ci/missing_assets_allowlist.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith("#"):
                      allow.add(line)
          path = "pytest.xml"
          out = []
          if os.path.exists(path):
              root = ET.parse(path).getroot()
              suites = root.findall("testsuite") or [root]
              tests = errors = failures = skipped = 0
              failed_keys, passed_keys, names_s = set(), set(), []
              for s in suites:
                  tests += int(s.get("tests", 0)); errors += int(s.get("errors", 0))
                  failures += int(s.get("failures", 0)); skipped += int(s.get("skipped", 0))
                  for tc in s.iter("testcase"):
                      fname = tc.get("classname", "").split(".")[-1] + ".py"
                      key = f"{fname}::{tc.get('name').split('[', 1)[0]}"
                      if tc.find("failure") is not None or tc.find("error") is not None:
                          failed_keys.add(key)
                      elif tc.find("skipped") is not None:
                          names_s.append(f"{key} — {tc.find('skipped').get('message', '')[:120]}")
                      else:
                          passed_keys.add(key)
              passed = tests - errors - failures - skipped
              explained = sorted(failed_keys & allow)
              unexplained = sorted(failed_keys - allow)
              stale = sorted(allow & passed_keys)
              out.append(f"## pytest: 通過 {passed} / 失敗 {failures + errors} / skip {skipped}（全 {tests}）")
              out.append(f"失敗のうち「資材が無い」一覧で説明できるもの {len(explained)}・**説明できないもの {len(unexplained)}**")
              out.append("")
              out.append("### 説明できない失敗（本物として扱う）")
              out += [f"- {n}" for n in unexplained] or ["- なし"]
              out.append("")
              out.append("### 資材が無いために落ちた検査（engine/ci/missing_assets_allowlist.txt）")
              out += [f"- {n}" for n in explained] or ["- なし"]
              out.append("")
              out.append("### 一覧にあるのに通った検査（一覧から消すこと）")
              out += [f"- {n}" for n in stale] or ["- なし"]
              out.append("")
              out.append("### skip（『通った』ではない）")
              out += [f"- {n}" for n in names_s] or ["- なし"]
              with open("unexplained.txt", "w", encoding="utf-8") as f:
                  f.write("\n".join(unexplained))
          else:
              out.append("## pytest.xml が無い（収集の段階で落ちた）。pytest_output.txt を見ること")
              with open("unexplained.txt", "w", encoding="utf-8") as f:
                  f.write("COLLECTION_FAILED")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          EOF

      - name: Keep the raw output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-output
          path: |
            pytest.xml
            pytest_output.txt
          if-no-files-found: ignore

      - name: Fail the job only on failures the allowlist does not explain
        run: |
          python - <<'EOF'
          import sys
          try:
              bad = open("unexplained.txt", encoding="utf-8").read().strip()
          except FileNotFoundError:
              print("unexplained.txt が無い"); sys.exit(1)
          if bad:
              print("説明できない失敗:"); print(bad); sys.exit(1)
          print("説明できない失敗なし")
          EOF
