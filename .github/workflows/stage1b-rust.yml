name: Stage 1B Rust verification

on:
  push:
    branches: [stage1b-encoding-v5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-python-lockstep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install Rust extension
        run: python -m pip install pytest numpy ./engine/rust
      - name: Run Stage 1B lockstep tests
        working-directory: engine
        run: >-
          python -m pytest -q
          tests/test_stage1b_encoding.py
          tests/test_stage1a_choices.py
          tests/test_drl.py
          tests/test_rust_engine.py
          tests/test_rust_agents.py
